[project]
name = "smart-paste"
version = "1.0.0"
description = "Smart Paste - Windows 剪贴板历史管理器"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Smart Paste Team"}
]
keywords = ["clipboard", "history", "manager", "pyqt6", "fluent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

dependencies = [
    "PyQt6>=6.5.0",
    "PyQt6-Qt6>=6.5.0",
    "pywin32>=305",
    "keyboard>=0.13.5",
    "Pillow>=10.0.0",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
fluent = [
    "PyQt-Fluent-Widgets>=1.6.0",
]

[project.scripts]
smart-paste = "main:main"
smart-paste-fluent = "main_fluent:main"

[project.urls]
Homepage = "https://github.com/smart-paste/smart-paste"
Repository = "https://github.com/smart-paste/smart-paste"
Issues = "https://github.com/smart-paste/smart-paste/issues"

[tool.uv]
python-downloads = "automatic"

[tool.uv.pip]
index-url = "https://pypi.org/simple"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.pydocstyle]
convention = "google"
